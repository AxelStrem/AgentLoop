<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AgentLoop - sign in</title>
<link rel="stylesheet" href="/page.css">
<script src="/signin.js" defer></script>
</head>
<body>
<header class="top">
  <h1>AgentLoop</h1>
</header>
<main>
  <form id="signin" class="signin">
    <h2>Sign in</h2>
    <p>The token is the one set for this AgentLoop (<code>AGENTLOOP_TOKEN</code>, or the file
    <code>server.tokenFile</code> names), or else the one <code>agentloop serve</code> printed.</p>
    <label>Token <input type="password" id="token" name="token" autocomplete="current-password" required autofocus></label>
    <button type="submit" class="primary">Sign in</button>
    <p id="message" class="message error" role="alert" hidden></p>
  </form>
</main>
</body>
</html>
