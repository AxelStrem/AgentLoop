[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloop"
dynamic = ["version"]
description = "The agent loop that works the project trackers, with a local web page"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# pytest is the only dependency, and for tests only; xdist runs the suite on every core (-n auto).
test = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
agentloop = "agentloop.cli:main"

[tool.setuptools.dynamic]
version = {attr = "agentloop.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# AUTOTASK.md travels with the tools, and the page's files with the server; the .py files are in
# the package already.
[tool.setuptools.package-data]
agentloop = ["tools/*.md", "page/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` tests are started first (tests/conftest.py), so that under -n auto each runs beside the
# rest of the suite rather than after it.
markers = ["slow: a test of a minute or more, moved to the front of the run"]
