# A release anyone can install (item package).
#
# A tag v<version> builds the wheel and the sdist, and the install scripts with the version written
# into them (install/install.sh and install/install.ps1, item installer). On Windows, macOS and Linux
# it installs the wheel with the script, as a person would, and tries it there
# (.github/try-install.py: `agentloop --version`, and `agentloop serve` answers its page). Then it
# attaches all four to a GitHub release of that tag, where releases/latest/download/install.sh and
# install.ps1 find them. The tag must be `v` + agentloop.__version__, so the version is raised in
# src/agentloop/__init__.py first.
#
# The container image (item docker-image, docker/Dockerfile) is built from the same wheel and tried:
# started with an empty /data and a token, the page must send a visitor to its sign-in, take the
# token and refuse a wrong one, run as the user 99 and not as root, install a Brewfile's jq as that
# user (item brew-tools), and end at once on docker stop.
# On a tag it is pushed to ghcr.io/<owner>/agentloop as :<version> and :latest, for linux/amd64
# alone - the image that was tried, from its cache - and the release's notes say how to pull it.
# Another platform would be built on a runner of its own kind, not emulated.
#
# Run by hand, it builds and tries the same and publishes nothing: a dry run before tagging.
#
# The tests are not run here: tests.yml runs them on the push of the branch the tag is on.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the version, and check the tag names it
        id: version
        run: |
          version=$(python -c "import ast, pathlib; t = ast.parse(pathlib.Path('src/agentloop/__init__.py').read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, but agentloop.__version__ is $version: tag v$version, or raise the version." >&2
            exit 1
          fi

      # build is the workflow's, not the app's: the app has no dependencies. Run as pyproject-build,
      # since `python -m build` finds the repository's own build.py first.
      - name: Build the wheel and the sdist
        run: |
          python -m pip install build
          pyproject-build

      # AUTOTASK.md and the page are package data, and review-run.py is no module name: a wheel
      # without one of them installs and starts, and fails only in a loop.
      - name: Check the wheel holds the tools and the page
        run: |
          python - dist/*.whl <<'EOF'
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          wanted = [f"agentloop/tools/{n}" for n in ("AUTOTASK.md", "AUTOTASK-windows.md", "tracker.py", "guard.py", "features.py", "review-run.py")]
          wanted += [f"agentloop/page/{n}" for n in ("index.html", "page.css", "page.js")]
          missing = [n for n in wanted if n not in names]
          if missing:
              sys.exit("The wheel is missing: " + ", ".join(missing))
          print(f"The wheel holds all {len(wanted)} files checked.")
          EOF

      # Each release's script installs that release's wheel.
      - name: Write the version into the install scripts
        run: |
          for script in install.sh install.ps1; do
            sed "s/@VERSION@/${{ steps.version.outputs.version }}/" "install/$script" > "dist/$script"
            grep -q "${{ steps.version.outputs.version }}" "dist/$script"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  try:
    needs: build
    name: try (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Only for try-install.py: the wheel is what is installed, not the checkout.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # For try-install.py alone: the script installs the app on a Python uv finds or brings.
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The script installs uv where the image has none, and the app on a Python uv finds or
      # brings. The built wheel stands in for the release's, which does not exist yet; agentloop
      # goes to a folder of the run's own, put on PATH for the try, and no shell profile is
      # changed. The page is not started: try-install.py starts it.
      - name: Install with the script
        env:
          AGENTLOOP_NO_SERVE: "1"
          UV_NO_MODIFY_PATH: "1"
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/agentloop-bin
        run: |
          export AGENTLOOP_WHEEL="$(ls dist/*.whl)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows PowerShell 5.1, which is what `irm ... | iex` runs in for most people.
            powershell -NoProfile -ExecutionPolicy Bypass -File dist/install.ps1
          else
            sh dist/install.sh
          fi
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Try it
        run: python .github/try-install.py "${{ needs.build.outputs.version }}"

  image:
    needs: [build, try]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: docker/setup-buildx-action@v3

      - name: Build the image for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: agentloop:try
          cache-to: type=gha,mode=max
          cache-from: type=gha

      # The token is the run's own, and never printed. The page answers through serve-lan's
      # sign-in: / to the form, the token for a cookie, a wrong one refused, the API with a bearer.
      - name: Try the image
        run: |
          set -eu
          token="$(openssl rand -hex 24)"
          data="$RUNNER_TEMP/data"
          mkdir -p "$data"
          docker run -d --name agentloop-try -e AGENTLOOP_TOKEN="$token" -v "$data:/data" -p 8765:8765 agentloop:try
          page=http://127.0.0.1:8765
          answer() { curl -s -o /dev/null -w '%{http_code}' "$@" || true; }
          for i in $(seq 60); do
            [ "$(answer "$page/")" = "303" ] && break
            sleep 1
          done
          fail() { echo "image: $*" >&2; docker logs agentloop-try >&2 || true; exit 1; }
          [ "$(answer "$page/")" = "303" ] || fail "the page did not answer / with a redirect in 60 s"
          curl -s -o /dev/null -D - "$page/" | grep -qi '^location: /signin.html' || fail "/ did not send a visitor to the sign-in form"
          [ "$(answer "$page/signin.html")" = "200" ] || fail "the sign-in form was not served"
          body="$(printf '{"token": "%s"}' "$token")"
          [ "$(answer -X POST -H 'Content-Type: application/json' --data "$body" "$page/api/signin")" = "200" ] || fail "the token set was refused at the sign-in"
          [ "$(answer -X POST -H 'Content-Type: application/json' --data '{"token": "not-the-token-at-all"}' "$page/api/signin")" = "401" ] || fail "a wrong token was not refused"
          [ "$(answer -H "Authorization: Bearer $token" "$page/api/loops")" = "200" ] || fail "the API refused the token"
          # Run as the user, not as root: Claude Code refuses its sessions' flag as root.
          # docker top needs a pid column, or it refuses the ps options.
          uid="$(docker top agentloop-try -eo pid,uid,args | awk '/agentloop serve/ && !/tini/ {print $2; exit}')"
          [ "$uid" = "99" ] || fail "serve runs as uid '$uid', not 99"
          [ "$(stat -c %u "$data/home")" = "99" ] || fail "/data/home does not belong to 99"
          for tool in "claude --version" "git --version" "node --version" "agentloop --version" "brew --version"; do
            docker exec -u 99:100 -e HOME=/data/home agentloop-try $tool || fail "$tool did not run as the user"
          done
          # A Brewfile's tools install as the user, from a bottle, into Homebrew's prefix.
          docker exec -u 99:100 -e HOME=/data/home agentloop-try sh -c \
            'cd /data/home && echo "brew \"jq\"" > Brewfile && brew bundle install --no-upgrade --file=Brewfile && jq --version' \
            || fail "a Brewfile's jq did not install as the user"
          # docker stop reaches serve through tini, and serve ends on it rather than being killed
          # after docker's 10 s.
          started="$(date +%s)"
          docker stop agentloop-try >/dev/null
          took=$(( $(date +%s) - started ))
          [ "$took" -lt 8 ] || fail "docker stop took ${took} s: serve did not end on SIGTERM"
          echo "image: the page answered through its sign-in, ran as 99, and stopped in ${took} s."

      - name: Log in to the GitHub container registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Name the image
        id: names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/agentloop" >> "$GITHUB_OUTPUT"

      - name: Push the image, for amd64
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ needs.build.outputs.version }}
            ${{ steps.names.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.description=The agent loop that works the project trackers, with its web page
          cache-from: type=gha

  release:
    needs: [build, try, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The notes begin with how to pull the image; gh adds the generated notes after them.
      - name: Attach the wheel, the sdist and the install scripts to a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "### Docker"
            echo
            echo "The image of this release, for linux/amd64:"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/$owner/agentloop:$VERSION"
            echo '```'
            echo
            echo '`:latest` is the newest release. See docs/container.md.'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
