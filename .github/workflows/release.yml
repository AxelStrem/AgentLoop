# A release anyone can install (item package).
#
# A tag v<version> builds the wheel and the sdist, installs the wheel with pipx on Windows, macOS
# and Linux and tries it there (.github/try-install.py: `agentloop --version`, and `agentloop serve`
# answers its page), and then attaches both to a GitHub release of that tag. The tag must be
# `v` + agentloop.__version__, so the version is raised in src/agentloop/__init__.py first.
#
# Run by hand, it builds and tries the same and publishes nothing: a dry run before tagging.
#
# The tests are not run here: tests.yml runs them on every push, the tag's commit included.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the version, and check the tag names it
        id: version
        run: |
          version=$(python -c "import ast, pathlib; t = ast.parse(pathlib.Path('src/agentloop/__init__.py').read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, but agentloop.__version__ is $version: tag v$version, or raise the version." >&2
            exit 1
          fi

      # build is the workflow's, not the app's: the app has no dependencies.
      - name: Build the wheel and the sdist
        run: |
          python -m pip install build
          python -m build

      # AUTOTASK.md and the page are package data, and review-run.py is no module name: a wheel
      # without one of them installs and starts, and fails only in a loop.
      - name: Check the wheel holds the tools and the page
        run: |
          python - dist/*.whl <<'EOF'
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          wanted = [f"agentloop/tools/{n}" for n in ("AUTOTASK.md", "AUTOTASK-windows.md", "tracker.py", "guard.py", "features.py", "review-run.py")]
          wanted += [f"agentloop/page/{n}" for n in ("index.html", "page.css", "page.js")]
          missing = [n for n in wanted if n not in names]
          if missing:
              sys.exit("The wheel is missing: " + ", ".join(missing))
          print(f"The wheel holds all {len(wanted)} files checked.")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  try:
    needs: build
    name: try (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Only for try-install.py: the wheel is what is installed, not the checkout.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The oldest Python the app supports.
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # pipx is installed with this Python rather than taken from the image, so that every system
      # installs the same way, and the app runs on the Python set up above.
      - name: Install the wheel with pipx
        run: |
          python -m pip install pipx
          python -m pipx install --python python dist/*.whl
          python -m pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"

      - name: Try it
        run: python .github/try-install.py "${{ needs.build.outputs.version }}"

  release:
    needs: [build, try]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Attach the wheel and the sdist to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
