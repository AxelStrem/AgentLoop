# The tests, on Windows, macOS and Linux (item ci).
#
# The repository is private for now, where a macOS minute costs ten Linux ones and a Windows minute
# two. So a push to main, and a run started by hand, test on all three systems. Every other push
# and every pull request test on Linux alone. A tag is not tested again: it names a commit the push
# to its branch tested already.
#
# The suite is small and needs nothing but Python, pytest and git: no test starts an Overseer
# server or reaches the network (item prunetests), so a run takes a minute or two on any system.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out AgentLoop
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The oldest Python the app supports, so that nothing newer slips in.
          python-version: "3.11"

      - name: Install AgentLoop
        run: python -m pip install -e ".[test]"

      # -rsfE lists every skipped test and why, and every failed or errored one. Failed tests are
      # also made annotations of the job (tests/conftest.py), which anyone can read through the API,
      # where the log itself needs admin rights. A test still running after two minutes has hung:
      # its stack is printed, and the job's timeout ends the run.
      - name: Run the tests
        run: python -m pytest -q -rsfE -o faulthandler_timeout=120
